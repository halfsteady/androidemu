[workspace]
resolver = "2"
members = ["core", "runner", "native", "desktop", "emulation-api", "emulation-runtime", "cores/nes-adapter", "cores/snes-adapter", "cores/synthetic"]
exclude = ["vendor/jgenesis"]
default-members = ["core", "runner", "native"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
