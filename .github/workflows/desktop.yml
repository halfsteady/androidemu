name: Desktop portability

on:
  push:
    paths: ["core/**", "runner/**", "desktop/**", "Cargo.*", ".cargo/**", "scripts/check-desktop.py", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["core/**", "runner/**", "desktop/**", "Cargo.*", ".cargo/**", "scripts/check-desktop.py", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Test core and runner
        run: cargo test --locked -p nes-core -p nes-runner
      - name: Build portable executables
        run: cargo build --release --locked -p nes-desktop -p nes-runner
      - name: Test desktop persistence
        run: cargo test --locked -p nes-desktop
      - name: Lint desktop frontend
        run: cargo clippy --locked -p nes-desktop --all-targets --no-deps -- -D warnings
      - name: Exercise SDL video and audio
        run: python3 scripts/check-desktop.py target/release/nes-desktop
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/nes-desktop target/release/nes-runner docs/DESKTOP.md dist/
          tar -czf emulia-${{ runner.os }}-${{ runner.arch }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: emulia-${{ runner.os }}-${{ runner.arch }}
          path: emulia-*.tar.gz
