name: Android release build

# Builds a signed release AAB + APK with the upload key (pulled from repo
# secrets, since the keystore is gitignored) and makes them downloadable:
#   • Run manually (Actions ▸ "Android release build" ▸ Run workflow) → the
#     AAB/APK are attached to the run as downloadable artifacts.
#   • Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) →
#     the same files are ALSO published as assets on a GitHub Release.
#
# The AAB is what Play Console wants; the APK is what you sideload onto the
# tablet. Both come out of the same run, so they are always the same build.
#
# Required repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   ANDROIDEMU_UPLOAD_KEYSTORE_BASE64  base64 of android/upload-keystore.jks
#   ANDROIDEMU_UPLOAD_STORE_PASSWORD   keystore (store) password
#   ANDROIDEMU_UPLOAD_KEY_PASSWORD     key password (same value here)
#   ANDROIDEMU_UPLOAD_KEY_ALIAS        amelianes-upload (the key predates the
#                                      rename; the alias is internal, and
#                                      rotating a signing key would be worse)
#   PLAY_SERVICE_ACCOUNT_JSON          optional; a Google Play service account
#                                      key. Absent, the build is unchanged and
#                                      the Play upload is skipped with a notice.
# See docs/RELEASING.md for the one-time `gh secret set` commands.
#
# Where a tag goes, once PLAY_SERVICE_ACCOUNT_JSON exists:
#   v0.2.3-rc1  ->  Play internal testing, live to testers
#   v0.2.3      ->  Play production, as a DRAFT, and only when the repository
#                   variable PLAY_PRODUCTION_ENABLED is `true`
#   manual run  ->  nowhere

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release + upload its assets (tag runs only)

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.ver.outputs.name }}
      track: ${{ steps.track.outputs.track }}
      status: ${{ steps.track.outputs.status }}
      configured: ${{ steps.track.outputs.configured }}
      note: ${{ steps.track.outputs.note }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 28.2.13676358
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;28.2.13676358"

      - name: Set up Rust (stable + Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Test the core
        run: cargo test --workspace --locked

      - name: AccuracyCoin regression
        run: |
          python3 scripts/test-accuracycoin.py
          curl --fail --location --output "$RUNNER_TEMP/AccuracyCoin.nes" https://raw.githubusercontent.com/100thCoin/AccuracyCoin/affc643aa771028510c4427451ecf5bba5e54592/AccuracyCoin.nes
          python3 scripts/check-accuracycoin.py "$RUNNER_TEMP/AccuracyCoin.nes" --report "$RUNNER_TEMP/accuracycoin.json"

      - name: Upload accuracy results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accuracycoin-android
          path: ${{ runner.temp }}/accuracycoin.json
          if-no-files-found: ignore

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROIDEMU_UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Derive version
        id: ver
        run: |
          # The same chronological rule android/app/build.gradle.kts uses for an
          # unstamped build: days since the project epoch, shifted four places,
          # plus UTC HHMM. A local build and a CI build therefore order by when
          # they were made, and neither can hand the tablet a version code below
          # the one already installed - Android reads that as a downgrade and
          # refuses it. The run number is not usable here: it starts at 1.
          day=$(( $(date -u +%s) / 86400 - $(date -u -d 2018-07-09 +%s) / 86400 ))
          code=$(( day * 10000 + 10#$(date -u +%H%M) ))
          if [ "${{ github.ref_type }}" = "tag" ]; then
            name="${{ github.ref_name }}"; name="${name#v}"
          else
            name="0.1.0-ci.${{ github.run_number }}"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code  versionName=$name"

      # Which Play track this build belongs on, decided by the tag alone so the
      # existing tagging habit needs no change: `v0.2.3-rc1` is a candidate and
      # goes to testers, `v0.2.3` is the real thing and goes to production. A
      # manual run is neither, and publishes nowhere.
      - name: Route to a Play track
        id: track
        env:
          # Only ever tested for emptiness, never printed. A job-level `if:`
          # cannot see the `secrets` context, so whether Play is set up at all
          # has to be decided here and carried out as a plain boolean --
          # otherwise every tag pushed before the service account exists ends in
          # a red run for a step that was never going to work.
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then configured=true; else configured=false; fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [ "$configured" != "true" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the Play upload."
          fi
          if [ "${{ github.ref_type }}" != "tag" ]; then
            track=none; status=none
          elif printf '%s' "${{ github.ref_name }}" | grep -Eq -- '-rc[0-9]+$'; then
            track=internal; status=completed
          else
            # draft, not completed: a production release then waits in the
            # console to be looked at rather than going live off a git push.
            track=production; status=draft
          fi
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "track=$track status=$status play-configured=$configured"

          # What a tester reads in the Play app. The first attempt used the
          # tagged COMMIT's message, which is a different kind of writing
          # entirely: 0.2.4-rc1 shipped to testers with a git trailer in its
          # release notes. An annotated tag's subject is a sentence somebody
          # wrote about the release, which is exactly what this field wants.
          note=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            note=$(git for-each-ref "refs/tags/${{ github.ref_name }}" \
                     --format='%(contents:subject)' 2>/dev/null || true)
          fi
          [ -n "$note" ] || note="Emulia ${{ steps.ver.outputs.name }}"
          echo "note=$note" >> "$GITHUB_OUTPUT"
          echo "note=$note"

      - name: Build signed AAB + APK
        working-directory: android
        env:
          ANDROIDEMU_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROIDEMU_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROIDEMU_UPLOAD_STORE_PASSWORD }}
          ANDROIDEMU_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROIDEMU_UPLOAD_KEY_ALIAS }}
          ANDROIDEMU_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROIDEMU_UPLOAD_KEY_PASSWORD }}
          ANDROIDEMU_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROIDEMU_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease lint --no-daemon --console=plain

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist/emulia-${{ steps.ver.outputs.name }}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/emulia-${{ steps.ver.outputs.name }}.apk"
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          ls -lh dist

      # Both files, and against the expected fingerprint rather than just
      # printing one: a debug-signed artifact should fail the job, not sail
      # through because nobody read the log. A deliberate key rotation is
      # supposed to require editing this line.
      - name: Verify signer (upload key, not debug)
        env:
          EXPECTED: 75fdccb5302705abcc12cf628de634cfb61cd57f735d33393984978dc31a0fd5
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          apk_digest=$("$apksigner" verify --print-certs \
            "dist/emulia-${{ steps.ver.outputs.name }}.apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          # An AAB is JAR-signed, so keytool is the tool that reads it.
          aab_digest=$("$JAVA_HOME/bin/keytool" -printcert -jarfile \
            "dist/emulia-${{ steps.ver.outputs.name }}.aab" \
            | sed -n 's/.*SHA256: //p' | head -1 | tr -d ': ' | tr 'A-Z' 'a-z')
          echo "apk $apk_digest"
          echo "aab $aab_digest"
          for got in "$apk_digest" "$aab_digest"; do
            if [ "$got" != "$EXPECTED" ]; then
              echo "::error::signed with $got, expected the upload key $EXPECTED"
              exit 1
            fi
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: emulia-${{ steps.ver.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish to GitHub Release (tag pushes only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.ver.outputs.name }}
        run: |
          # The release may already exist: creating one in the GitHub UI makes
          # the release (and tag) BEFORE this tag-triggered run starts. So
          # upload to it if present, otherwise create it. --clobber keeps
          # re-runs idempotent.
          files="dist/emulia-$NAME.aab dist/emulia-$NAME.apk dist/SHA256SUMS.txt"
          # A semver pre-release version carries a hyphen: v0.2.1-rc1 is a
          # candidate, v0.2.1 is the real thing. Marking it keeps "Latest
          # release" - what a sideloader lands on - pointing at the last
          # finished build rather than at a candidate.
          case "$NAME" in
            *-*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # An existing release keeps whatever flag it was created with; only
            # its assets are replaced.
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "$TAG" --generate-notes $prerelease
          fi

  # Publishing is a SEPARATE job on purpose. A Play API failure - a propagating
  # permission, a rejected version code, an expired key - then costs the upload
  # and nothing else: the GitHub Release and its assets are already published by
  # the job above, and re-running just this one is cheap. It also gives
  # production somewhere to hang an approval gate that internal does not want.
  #
  # Neither job touches the build. They download the same signed .aab the build
  # job produced and verified, so what reaches Play is byte-identical to what is
  # on the GitHub Release.

  publish-internal:
    needs: build
    if: needs.build.outputs.track == 'internal' && needs.build.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: emulia-${{ needs.build.outputs.name }}
          path: dist

      - name: Release notes for testers
        env:
          NOTE: ${{ needs.build.outputs.note }}
        run: |
          # Play wants one file per locale, rejects an empty one, and caps it at
          # 500 characters.
          mkdir -p whatsnew
          printf '%s\n' "$(printf '%s' "$NOTE" | head -c 480)" > whatsnew/whatsnew-en-US
          cat whatsnew/whatsnew-en-US

      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bsteinfeld.emulia
          releaseFiles: dist/emulia-${{ needs.build.outputs.name }}.aab
          tracks: internal
          status: ${{ needs.build.outputs.status }}
          releaseName: ${{ needs.build.outputs.name }}
          whatsNewDirectory: whatsnew

  # Disabled until the store listing is finished. Emulia is still a Draft app:
  # production is Inactive and the setup checklist is 8/11, with the privacy
  # policy and the Data safety form outstanding, so an upload here would have
  # nowhere to land. Switch it on by setting the repository VARIABLE (not
  # secret) PLAY_PRODUCTION_ENABLED to `true`, and grant the service account
  # "Release to production" at the same time.
  #
  # `environment: play-production` is where an approval gate goes: add required
  # reviewers to that environment in repo settings and a production upload waits
  # for a click. Without reviewers configured it simply runs.
  publish-production:
    needs: build
    if: >-
      needs.build.outputs.track == 'production'
      && needs.build.outputs.configured == 'true'
      && vars.PLAY_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: play-production
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: emulia-${{ needs.build.outputs.name }}
          path: dist

      - name: Upload to Play production (as a draft release)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bsteinfeld.emulia
          releaseFiles: dist/emulia-${{ needs.build.outputs.name }}.aab
          tracks: production
          # draft: it waits in the console. Going live is still a human clicking
          # "Send for review", which is the right shape for a first production
          # release and probably for the next several.
          status: ${{ needs.build.outputs.status }}
          releaseName: ${{ needs.build.outputs.name }}
