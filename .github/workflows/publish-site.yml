name: Publish site to emulia-site

# Mirrors the site/ folder into bsteinfeld/emulia-site whenever a change under
# /site lands on main. The push there triggers emulia-site's own Pages deploy,
# which serves https://emulia.website.
#
# emulia-site exists only because this repository is private: GitHub Pages will
# not serve a private repo on a free plan, and making this one public to publish
# a marketing page would publish the whole emulator with it.
#
# Requires a repository secret EMULIA_SITE_DEPLOY_KEY: the private half of an
# SSH deploy key that has write access to bsteinfeld/emulia-site. A deploy key
# rather than a personal token, because it reaches exactly one repository and
# nothing else on the account. Absent, the sync is skipped with a notice rather
# than failing the run.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check-site.py"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'halfsteady' && github.event.repository.private == true
    timeout-minutes: 15
    runs-on: [self-hosted, Linux, X64, halfsteady-linux-x64]
    steps:
      - name: Check out androidemu
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The site has no build step, so nothing else would ever notice a renamed
      # screenshot or a mistyped href before it 404s on the live page.
      - name: Check the site is whole
        run: python3 scripts/check-site.py

      # A job-level `if:` cannot see the secrets context, so whether the deploy
      # key exists has to be decided in a step and carried as a plain boolean.
      # Otherwise every push made before the secret is set ends in a red run for
      # a step that was never going to work.
      - name: Is the deploy key configured?
        id: key
        env:
          DEPLOY_KEY: ${{ secrets.EMULIA_SITE_DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EMULIA_SITE_DEPLOY_KEY is not set; skipping the sync to emulia-site."
          fi

      - name: Authorise the deploy key
        if: steps.key.outputs.configured == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.EMULIA_SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check out emulia-site
        if: steps.key.outputs.configured == 'true'
        run: git clone --depth 1 git@github.com:bsteinfeld/emulia-site.git .emulia-site

      - name: Sync site/ into emulia-site
        if: steps.key.outputs.configured == 'true'
        # site/README.md documents the folder for this repository; it is not
        # part of the website and has no business being served from it.
        run: rsync -a --delete --exclude README.md site/ .emulia-site/site/

      - name: Commit and push if anything changed
        if: steps.key.outputs.configured == 'true'
        working-directory: .emulia-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "site/ is already in sync — nothing to publish"
            exit 0
          fi
          git commit -m "Sync site from androidemu@${GITHUB_SHA::7}"
          git push

      - name: Remove deploy key
        if: always()
        run: rm -f -- "$HOME/.ssh/id_ed25519"
