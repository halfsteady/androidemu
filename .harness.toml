[project]
  name = "androidemu"
  purpose = "nes emulator"
  created = "2026-09-06"

[session]
  tmux = "androidemu"
  default_model = ""

[[task]]
  name = "visuals"
  purpose = "Picture looks, filters and palettes — the visual side of Emulia"
  dir = ".harness/worktrees/visuals"
  phase = "completed"
  branch = "feat/visuals"

[[task]]
  name = "site"
  dir = ".harness/worktrees/site"
  phase = "completed"
  branch = "site"
  agent = "claude"

[[task]]
  name = "review-accuracy"
  dir = ".harness/worktrees/review-accuracy"
  phase = "completed"
  branch = "feat/core-accuracy"
  agent = "codex"

[[terminal]]
  name = "main"
  tmux = "androidemu"
  main = true
  agent = "claude"

[[terminal]]
  name = "visuals"
  task = "visuals"
  tmux = "androidemu-visuals"
  agent = "claude"

[[terminal]]
  name = "site"
  task = "site"
  tmux = "androidemu-site"
  agent = "claude"

[[terminal]]
  name = "review-accuracy"
  task = "review-accuracy"
  tmux = "androidemu-review-accuracy"
  agent = "codex"

[[terminal]]
  name = "fabkefixer"
  task = "review-accuracy"
  tmux = "androidemu-fabkefixer"
  agent = "claude"

[[terminal]]
  name = "main-astra"
  tmux = "androidemu-main-astra"
  agent = "codex"
